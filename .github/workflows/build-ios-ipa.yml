name: Build iOS IPA

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.swift'
      - '**/*.m'
      - '**/*.mm'
      - '**/*.h'
      - '**/*.xcodeproj/**'
      - '**/*.xcworkspace/**'
      - '.github/workflows/build-ios-ipa.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/*.swift'
      - '**/*.m'
      - '**/*.mm'
      - '**/*.h'
      - '**/*.xcodeproj/**'
      - '**/*.xcworkspace/**'

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 60

    env:
      SCHEME: Minis
      CONFIGURATION: Release
      WORKSPACE: ""
      PROJECT: src/ios/Minis.xcodeproj
      ARCHIVE_PATH: ${{ github.workspace }}/build/OpenMinis.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      EXPORT_OPTIONS_PLIST: ${{ runner.temp }}/ExportOptions.plist
      SPM_CACHE_PATH: ${{ github.workspace }}/.swiftpm
      LOGS_PATH: ${{ runner.temp }}/ios-build-logs
      ARCHIVE_LOG_PATH: ${{ runner.temp }}/ios-build-logs/archive.log
      EXPORT_LOG_PATH: ${{ runner.temp }}/ios-build-logs/export.log
      RESULT_BUNDLE_PATH: ${{ runner.temp }}/ios-build-logs/archive.xcresult
      KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
      CERT_PATH: ${{ runner.temp }}/signing-cert.p12
      PROFILE_PATH: ${{ runner.temp }}/signing-profile.mobileprovision
      PROFILE_PLIST_PATH: ${{ runner.temp }}/signing-profile.plist

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.SPM_CACHE_PATH }}
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('src/ios/Minis.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Determine signing context
        id: signing_context
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail

          has_cert=false
          has_password=false
          has_profile=false

          if [ -n "${IOS_P12_BASE64:-}" ]; then
            has_cert=true
          fi

          if [ -n "${IOS_P12_PASSWORD:-}" ]; then
            has_password=true
          fi

          if [ -n "${IOS_MOBILEPROVISION_BASE64:-}" ]; then
            has_profile=true
          fi

          should_export=false
          if [ "$has_cert" = true ] && [ "$has_password" = true ] && [ "$has_profile" = true ]; then
            should_export=true
          fi

          has_any_signing_assets=false
          if [ "$has_cert" = true ] || [ "$has_password" = true ] || [ "$has_profile" = true ]; then
            has_any_signing_assets=true
          fi

          has_partial_signing_assets=false
          if [ "$has_any_signing_assets" = true ] && [ "$should_export" = false ]; then
            has_partial_signing_assets=true
          fi

          echo "should_export=$should_export" >> "$GITHUB_OUTPUT"
          echo "has_any_signing_assets=$has_any_signing_assets" >> "$GITHUB_OUTPUT"
          echo "has_partial_signing_assets=$has_partial_signing_assets" >> "$GITHUB_OUTPUT"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          mkdir -p "$SPM_CACHE_PATH"

          if [ -n "$WORKSPACE" ]; then
            xcodebuild -resolvePackageDependencies \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -clonedSourcePackagesDirPath "$SPM_CACHE_PATH"
          else
            xcodebuild -resolvePackageDependencies \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -clonedSourcePackagesDirPath "$SPM_CACHE_PATH"
          fi

      - name: Install signing certificate
        if: ${{ steps.signing_context.outputs.should_export == 'true' }}
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD || 'temp_keychain_password' }}
        run: |
          set -euo pipefail
          umask 077

          printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        if: ${{ steps.signing_context.outputs.should_export == 'true' }}
        env:
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"

          printf '%s' "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST_PATH"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST_PATH")"
          installed_profile_path="$profile_dir/$profile_uuid.mobileprovision"

          install -m 600 "$PROFILE_PATH" "$installed_profile_path"
          echo "INSTALLED_PROFILE_PATH=$installed_profile_path" >> "$GITHUB_ENV"

      - name: Create ExportOptions.plist
        if: ${{ steps.signing_context.outputs.should_export == 'true' }}
        run: |
          set -euo pipefail
          cat > "$EXPORT_OPTIONS_PLIST" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST

      - name: Archive app
        id: archive_app
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$LOGS_PATH"
          should_export="${{ steps.signing_context.outputs.should_export }}"

          extra_args=()
          if [ "$should_export" != "true" ]; then
            extra_args+=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          fi

          if [ -n "$WORKSPACE" ]; then
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration "$CONFIGURATION" \
              -sdk iphoneos \
              -archivePath "$ARCHIVE_PATH" \
              -resultBundlePath "$RESULT_BUNDLE_PATH" \
              -clonedSourcePackagesDirPath "$SPM_CACHE_PATH" \
              "${extra_args[@]}" \
              clean archive 2>&1 | tee "$ARCHIVE_LOG_PATH"
          else
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration "$CONFIGURATION" \
              -sdk iphoneos \
              -archivePath "$ARCHIVE_PATH" \
              -resultBundlePath "$RESULT_BUNDLE_PATH" \
              -clonedSourcePackagesDirPath "$SPM_CACHE_PATH" \
              "${extra_args[@]}" \
              clean archive 2>&1 | tee "$ARCHIVE_LOG_PATH"
          fi

      - name: Export IPA (if signing assets are available)
        id: export_ipa
        if: ${{ steps.signing_context.outputs.should_export == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" 2>&1 | tee "$EXPORT_LOG_PATH"

      - name: Note skipped IPA export
        if: ${{ steps.signing_context.outputs.should_export != 'true' && steps.signing_context.outputs.has_any_signing_assets != 'true' }}
        run: |
          echo "Signing assets are unavailable for this run, so the workflow uploaded the archive and build diagnostics only."

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: ${{ env.LOGS_PATH }}
          if-no-files-found: warn

      - name: Upload archive
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcarchive
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: warn

      - name: Upload IPA (if generated)
        if: ${{ steps.export_ipa.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.EXPORT_PATH }}/*.ipa
          if-no-files-found: error

      - name: Upload export diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-export-diagnostics
          path: |
            ${{ env.EXPORT_PATH }}
            ${{ env.EXPORT_OPTIONS_PLIST }}
          if-no-files-found: warn

      - name: Fail when IPA export could not complete
        if: ${{ always() && steps.archive_app.outcome == 'success' && (steps.signing_context.outputs.has_partial_signing_assets == 'true' || steps.export_ipa.outcome == 'failure') }}
        run: |
          set -euo pipefail

          if [ "${{ steps.signing_context.outputs.has_partial_signing_assets }}" = "true" ]; then
            echo "IPA export was skipped because signing secrets are incomplete. Provide IOS_P12_BASE64, IOS_P12_PASSWORD, and IOS_MOBILEPROVISION_BASE64 to export a signed IPA."
          else
            echo "IPA export failed after a successful archive. Inspect the uploaded ios-build-diagnostics and ios-export-diagnostics artifacts for details."
          fi

          exit 1

      - name: Clean up signing assets
        if: ${{ always() }}
        run: |
          set -euo pipefail

          rm -f "$CERT_PATH" "$PROFILE_PATH" "$PROFILE_PLIST_PATH" "$EXPORT_OPTIONS_PLIST"

          if [ -n "${INSTALLED_PROFILE_PATH:-}" ]; then
            rm -f "$INSTALLED_PROFILE_PATH"
          fi

          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || rm -f "$KEYCHAIN_PATH"
          fi
